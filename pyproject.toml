[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Blender-CamSight"
version = "1.0.0"
description = "Blender add-on that shows a live first-person camera monitor without leaving the free 3D viewport."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "AXCEL BLADE" }]
keywords = ["blender", "camera", "viewport", "addon"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
